version: "3.9"

services:

  postgres:
    image: postgres:16
    container_name: raices_postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: raices_db
      POSTGRES_USER: raices_user
      POSTGRES_PASSWORD: raices_password

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: raices_redis
    restart: unless-stopped

    ports:
      - "6379:6379"

  pgadmin:
    image: dpage/pgadmin4
    container_name: raices_pgadmin
    restart: unless-stopped

    environment:
      PGADMIN_DEFAULT_EMAIL: admin@raices.mx
      PGADMIN_DEFAULT_PASSWORD: Admin123*

    ports:
      - "5050:80"

    depends_on:
      - postgres

volumes:
  postgres_data: